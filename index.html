<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WasWorld Industries</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <header>
    <div class="wrapper">
      <nav>
        <img
          class="logo"
          src="assets/logos/wasworld/wasworld-logo.png"
          alt="WasWorld Industries Logo"
        />
        <div class="links">
          <a href="index.html">Home</a>
          <a href="#">About</a>
          <a href="#">Games</a>
        </div>
      </nav>
    </div>
  </header>
  <body>
    <section class="hero-screen">
      <div class="wrapper">
        <div class="hero">
          <img
            class="hero-logo"
            src="assets/logos/cornpopper/cornpopper-logo.png"
            alt="Corn Popper logo"
          />
          <div class="hero-subtitle">
            You like popcorn? Well, then get to poppin!
          </div>
          <button class="hero-button" href="">Play Now</button>
        </div>
      </div>
    </section>
    <section class="games-screen">
      <div class="wrapper">
        <h2>WasWorld Games</h2>

        <div class="games-container">
          <div class="game-card" id="gools-and-gunkheads">
            <div class="game-thumb"></div>
            <div class="game-logo"></div>
          </div>

          <div class="game-card" id="corn-popper">
            <div class="game-thumb"></div>
            <div class="game-logo"></div>
          </div>

          <div class="game-card" id="travellin' sweet">
            <div class="game-thumb"></div>
            <div class="game-logo"></div>
          </div>

          <div class="game-card" id="hands-of-fake">
            <div class="game-thumb"></div>
            <div class="game-logo"></div>
          </div>
        </div>
      </div>
    </section>
  </body>

  <footer></footer>
</html>
